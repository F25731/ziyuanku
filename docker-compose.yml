services:
  mysql:
    image: mysql:8.0
    container_name: lrh-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lanzou_hub
      MYSQL_USER: lanzou_hub
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=128M
      - --innodb-log-file-size=48M
      - --max-connections=80
      - --performance-schema=OFF
    volumes:
      - mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [internal]

  redis:
    image: redis:7-alpine
    container_name: lrh-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 96M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lanzou-resource-hub:latest
    container_name: lrh-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # 1.9G 总内存的轻量服务器：mysql ~300M、redis ~30M，app 给 Node 上限 768M
      # 默认用 MySQL FULLTEXT；启用 docker-compose.search.yml 后搜索走轻量 Manticore
      NODE_OPTIONS: --max-old-space-size=768
      PORT: 3000
      TZ: Asia/Shanghai
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: lanzou_hub
      DB_USER: lanzou_hub
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_LIMIT: ${DB_POOL_LIMIT:-30}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      ADMIN_INIT_USERNAME: ${ADMIN_INIT_USERNAME:-admin}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:-Admin@123456}
      LINK_CACHE_TTL: ${LINK_CACHE_TTL:-1800}
      API_RATE_LIMIT_PER_MIN: ${API_RATE_LIMIT_PER_MIN:-60}
      API_KEY_CACHE_TTL: ${API_KEY_CACHE_TTL:-300}
      API_LOG_FLUSH_INTERVAL_MS: ${API_LOG_FLUSH_INTERVAL_MS:-2000}
      API_LOG_FLUSH_BATCH: ${API_LOG_FLUSH_BATCH:-500}
      API_LOG_QUEUE_MAX: ${API_LOG_QUEUE_MAX:-20000}
      API_LOG_RAW_ENABLED: ${API_LOG_RAW_ENABLED:-1}
      STATS_CACHE_TTL: ${STATS_CACHE_TTL:-60}
      STATS_TREND_CACHE_TTL: ${STATS_TREND_CACHE_TTL:-300}
      STATS_RESOURCE_EXACT: ${STATS_RESOURCE_EXACT:-0}
      SEARCH_ENGINE: ${SEARCH_ENGINE:-mysql}
      MANTICORE_URL: ${MANTICORE_URL:-}
      MANTICORE_INDEX: ${MANTICORE_INDEX:-lrh_resources}
      MANTICORE_BATCH_SIZE: ${MANTICORE_BATCH_SIZE:-1000}
      MANTICORE_RETRY_ATTEMPTS: ${MANTICORE_RETRY_ATTEMPTS:-5}
      MANTICORE_MAX_MATCHES: ${MANTICORE_MAX_MATCHES:-20000}
      SEARCH_TIMEOUT_MS: ${SEARCH_TIMEOUT_MS:-5000}
      SEARCH_CACHE_ENABLED: ${SEARCH_CACHE_ENABLED:-1}
      SEARCH_CACHE_TTL: ${SEARCH_CACHE_TTL:-60}
      SEARCH_CACHE_HOT_TTL: ${SEARCH_CACHE_HOT_TTL:-600}
      SEARCH_CACHE_HOT_MIN: ${SEARCH_CACHE_HOT_MIN:-3}
      SEARCH_MIN_QUERY_LEN: ${SEARCH_MIN_QUERY_LEN:-2}
      SEARCH_REQUIRE_EXTERNAL: ${SEARCH_REQUIRE_EXTERNAL:-0}
      SEARCH_OUTBOX_WORKER_ENABLED: ${SEARCH_OUTBOX_WORKER_ENABLED:-1}
      SEARCH_OUTBOX_BATCH: ${SEARCH_OUTBOX_BATCH:-500}
      SEARCH_OUTBOX_INTERVAL_MS: ${SEARCH_OUTBOX_INTERVAL_MS:-5000}
      SEARCH_OUTBOX_MAX_ATTEMPTS: ${SEARCH_OUTBOX_MAX_ATTEMPTS:-10}
      RECONCILE_DELETE_BATCH: ${RECONCILE_DELETE_BATCH:-5000}
      RESOURCE_META_BACKFILL_BATCH: ${RESOURCE_META_BACKFILL_BATCH:-5000}
      SYNC_UPSERT_BATCH: ${SYNC_UPSERT_BATCH:-200}
      SYNC_MAX_INDEX_DEPTH: ${SYNC_MAX_INDEX_DEPTH:-20}
    deploy:
      resources:
        limits:
          memory: 1024M
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]

volumes:
  mysql_data:
  redis_data:

networks:
  internal:
    driver: bridge
