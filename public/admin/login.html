<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · 云逸蓝奏</title>
  <link rel="icon" type="image/svg+xml" href="/admin/assets/logo.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .bg-mesh {
      background-color: #0f172a;
      background-image:
        radial-gradient(at 20% 10%, rgba(59,130,246,0.35) 0, transparent 50%),
        radial-gradient(at 80% 20%, rgba(139,92,246,0.3)  0, transparent 50%),
        radial-gradient(at 60% 80%, rgba(16,185,129,0.25) 0, transparent 55%);
    }
  </style>
</head>
<body class="bg-mesh min-h-screen flex items-center justify-center p-4">
  <div x-data="loginApp()" class="w-full max-w-md">
    <div class="text-center mb-8">
      <img src="/admin/assets/logo.svg" alt="云逸蓝奏"
        class="w-20 h-20 mx-auto mb-4 drop-shadow-2xl shadow-blue-500/40 rounded-2xl">
      <h1 class="text-3xl font-bold text-white tracking-tight">云逸蓝奏</h1>
      <p class="text-slate-400 mt-2 text-sm">资源库 · 管理控制台</p>
    </div>

    <form @submit.prevent="submit" class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl p-8 shadow-2xl">
      <label class="block mb-4">
        <span class="text-slate-200 text-sm font-medium">账号</span>
        <input x-model="username" type="text" autocomplete="username" required
          class="mt-2 w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent"
          placeholder="admin">
      </label>
      <label class="block mb-6">
        <span class="text-slate-200 text-sm font-medium">密码</span>
        <input x-model="password" type="password" autocomplete="current-password" required
          class="mt-2 w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent"
          placeholder="请输入密码">
      </label>

      <button type="submit" :disabled="loading"
        class="w-full py-3 rounded-lg bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-semibold shadow-lg shadow-blue-500/30 transition-all disabled:opacity-60 disabled:cursor-not-allowed">
        <span x-show="!loading">登录控制台</span>
        <span x-show="loading">登录中...</span>
      </button>

      <div x-show="errMsg" x-transition class="mt-4 p-3 rounded-lg bg-red-500/20 border border-red-500/40 text-red-200 text-sm" x-text="errMsg"></div>
    </form>
  </div>

  <script>
    function loginApp() {
      return {
        username: '', password: '', loading: false, errMsg: '',
        async submit() {
          this.loading = true; this.errMsg = '';
          try {
            const r = await fetch('/api/admin/login', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ username: this.username, password: this.password })
            });
            const d = await r.json();
            if (!r.ok) { this.errMsg = d.message || '登录失败'; return; }
            localStorage.setItem('lrh_token', d.token);
            localStorage.setItem('lrh_user', JSON.stringify(d.user));
            location.href = '/admin/dashboard.html';
          } catch (e) {
            this.errMsg = '网络错误: ' + e.message;
          } finally { this.loading = false; }
        }
      };
    }
  </script>
</body>
</html>
