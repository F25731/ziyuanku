services:
  manticore:
    image: manticoresearch/manticore:latest
    container_name: lrh-manticore
    restart: unless-stopped
    environment:
      EXTRA: 1
      TZ: Asia/Shanghai
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    mem_limit: ${MANTICORE_MEMORY_LIMIT:-2g}
    volumes:
      - manticore_data:/var/lib/manticore
    deploy:
      resources:
        limits:
          memory: ${MANTICORE_MEMORY_LIMIT:-2g}
    networks: [internal]

  app:
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      manticore:
        condition: service_started
    environment:
      SEARCH_ENGINE: manticore
      MANTICORE_URL: http://manticore:9308
      MANTICORE_INDEX: ${MANTICORE_INDEX:-lrh_resources}
      MANTICORE_BATCH_SIZE: ${MANTICORE_BATCH_SIZE:-1000}
      MANTICORE_RETRY_ATTEMPTS: ${MANTICORE_RETRY_ATTEMPTS:-5}
      MANTICORE_MAX_MATCHES: ${MANTICORE_MAX_MATCHES:-20000}
      SEARCH_TIMEOUT_MS: ${SEARCH_TIMEOUT_MS:-30000}
      SEARCH_OUTBOX_WORKER_ENABLED: "0"

  search-worker:
    image: lanzou-resource-hub:latest
    container_name: lrh-search-worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      manticore:
        condition: service_started
      app:
        condition: service_started
    command: ["npm", "run", "search:worker"]
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: lanzou_hub
      DB_USER: lanzou_hub
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_LIMIT: ${DB_POOL_LIMIT:-10}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      SEARCH_ENGINE: manticore
      MANTICORE_URL: http://manticore:9308
      MANTICORE_INDEX: ${MANTICORE_INDEX:-lrh_resources}
      MANTICORE_BATCH_SIZE: ${MANTICORE_BATCH_SIZE:-1000}
      MANTICORE_RETRY_ATTEMPTS: ${MANTICORE_RETRY_ATTEMPTS:-5}
      MANTICORE_MAX_MATCHES: ${MANTICORE_MAX_MATCHES:-20000}
      SEARCH_TIMEOUT_MS: ${SEARCH_TIMEOUT_MS:-30000}
      SEARCH_OUTBOX_BATCH: ${SEARCH_OUTBOX_BATCH:-500}
      SEARCH_OUTBOX_INTERVAL_MS: ${SEARCH_OUTBOX_INTERVAL_MS:-5000}
      SEARCH_OUTBOX_MAX_ATTEMPTS: ${SEARCH_OUTBOX_MAX_ATTEMPTS:-10}
      SEARCH_JOB_INTERVAL_MS: ${SEARCH_JOB_INTERVAL_MS:-5000}
      SEARCH_JOB_STALE_SECONDS: ${SEARCH_JOB_STALE_SECONDS:-600}
    volumes:
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [internal]

volumes:
  manticore_data:
