services:
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: lrh-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_MAX_INDEXING_MEMORY: ${MEILI_MAX_INDEXING_MEMORY:-256Mb}
      MEILI_MAX_INDEXING_THREADS: ${MEILI_MAX_INDEXING_THREADS:-1}
      MEILI_EXPERIMENTAL_REDUCE_INDEXING_MEMORY_USAGE: ${MEILI_EXPERIMENTAL_REDUCE_INDEXING_MEMORY_USAGE:-true}
      TZ: Asia/Shanghai
    volumes:
      - meili_data:/meili_data
    deploy:
      resources:
        limits:
          memory: ${MEILI_MEMORY_LIMIT:-768m}
    networks: [internal]

  app:
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    environment:
      SEARCH_ENGINE: meilisearch
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_INDEX: ${MEILI_INDEX:-lrh_resources}
      MEILI_BATCH_SIZE: ${MEILI_BATCH_SIZE:-1000}
      MEILI_RETRY_ATTEMPTS: ${MEILI_RETRY_ATTEMPTS:-5}
      MEILI_MAX_TOTAL_HITS: ${MEILI_MAX_TOTAL_HITS:-20000}
      SEARCH_TIMEOUT_MS: ${SEARCH_TIMEOUT_MS:-30000}
      SEARCH_OUTBOX_WORKER_ENABLED: "0"

  search-worker:
    image: lanzou-resource-hub:latest
    container_name: lrh-search-worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      meilisearch:
        condition: service_started
      app:
        condition: service_started
    command: ["npm", "run", "search:worker"]
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: lanzou_hub
      DB_USER: lanzou_hub
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_LIMIT: ${DB_POOL_LIMIT:-10}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      SEARCH_ENGINE: meilisearch
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_INDEX: ${MEILI_INDEX:-lrh_resources}
      MEILI_BATCH_SIZE: ${MEILI_BATCH_SIZE:-1000}
      MEILI_RETRY_ATTEMPTS: ${MEILI_RETRY_ATTEMPTS:-5}
      MEILI_MAX_TOTAL_HITS: ${MEILI_MAX_TOTAL_HITS:-20000}
      SEARCH_TIMEOUT_MS: ${SEARCH_TIMEOUT_MS:-30000}
      SEARCH_OUTBOX_BATCH: ${SEARCH_OUTBOX_BATCH:-500}
      SEARCH_OUTBOX_INTERVAL_MS: ${SEARCH_OUTBOX_INTERVAL_MS:-5000}
      SEARCH_OUTBOX_MAX_ATTEMPTS: ${SEARCH_OUTBOX_MAX_ATTEMPTS:-10}
      SEARCH_JOB_INTERVAL_MS: ${SEARCH_JOB_INTERVAL_MS:-5000}
      SEARCH_JOB_STALE_SECONDS: ${SEARCH_JOB_STALE_SECONDS:-600}
    volumes:
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [internal]

volumes:
  meili_data:
